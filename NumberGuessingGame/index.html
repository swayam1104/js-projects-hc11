<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guesssing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrapper">
        <h1>Number Guesssing Game</h1>
        <p>
            Try and guess a number between 1 and 100
        </p>
        <p>
            You have 10 attempts to guess the right number
        </p>
        <form class="form">
            <label for="guessField" id="guess">
                Guess A Number
            </label>

            <input
                type="text"
                id="guessField"
                class="guessField"
                placeholder="Enter your guess"
            >

            <input
                type="submit"
                id="subt"
                value="Submit Guess"
                class="guessSubmit"
            >
        </form>

        <div class="resultParas">
            <p>
                Previous Guesses:
                <span class="lastResult">10</span>
            </p>
            <p class="lowOrHi"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
